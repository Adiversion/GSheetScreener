name: Daily NSE Momentum Screener

on:
  schedule:
    # Every weekday (Monday to Friday) at 12:00 PM UTC = 5:30 PM IST (post market close)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:  # Manual trigger from GitHub mobile app or browser

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r nse-momentum-engine/requirements.txt

      - name: Run Quant Engine (DuckDB & Minervini SEPA)
        run: python nse-momentum-engine/src/quant_engine.py 1000

      - name: Commit updated signal data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"
          git add nse-momentum-engine/app/data/ nse-momentum-engine/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(signal): update live screener data [$(date -u +'%Y-%m-%d %H:%M')]" && git push)

