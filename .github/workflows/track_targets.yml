name: Daily Rotation Target Tracker

on:
  schedule:
    # One post-close reconciliation per weekday. Live in-app tracking is done by
    # the PWA itself (Twelve Data key or a Cloudflare Worker proxy) — no cron.
    # IST = UTC+5:30.
    - cron: '0 12 * * 1-5'   # 17:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r nse-momentum-engine/requirements.txt

      - name: Track open positions against their +15% target
        env:
          # Optional — enables real-time LTP. Without these it uses yfinance.
          KITE_API_KEY:        ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN:   ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python nse-momentum-engine/scripts/track_targets.py --out nse-momentum-engine/app/data/targets.json

      - name: Commit tracked targets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"
          git add nse-momentum-engine/app/data/targets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(targets): update tracker [$(date -u +'%Y-%m-%d %H:%M')]" && git push)
