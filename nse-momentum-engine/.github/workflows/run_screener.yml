name: Weekly NSE Momentum Screener

on:
  schedule:
    # Every Friday at 12:00 PM UTC = 5:30 PM IST (post NSE settlement & Bhavcopy publication)
    - cron: '0 12 * * 5'
  workflow_dispatch:  # Manual trigger from GitHub mobile app or browser

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Pump & Screener
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_NAME:              ${{ vars.SHEET_NAME || 'NSE Momentum Engine' }}
        run: python src/data_pump.py

      - name: Build status badge
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Job status: $STATUS"
          # Write a simple status file
          echo "{\"status\": \"$STATUS\", \"run_at\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > data/last_run.json
          mkdir -p data

      - name: Commit run log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"
          mkdir -p data
          echo "{\"last_run\": \"$(date -u +'%Y-%m-%d %H:%M UTC')\"}" > data/last_run.json
          git add data/last_run.json
          git commit -m "chore: screener run [$(date -u +'%Y-%m-%d')]" || echo "No changes"
          git push
